name: canonical-quote-v1-current

on:
  pull_request:
    paths:
      - "contracts/canonical-quote-v1-current.json"
      - "scripts/verify_canonical_quote_v1_current.py"
      - ".github/workflows/canonical-quote-v1-current.yml"
  push:
    branches:
      - "agent/canonical-quote-v1-conformance-v2-20260809"
    paths:
      - "contracts/canonical-quote-v1-current.json"
      - "scripts/verify_canonical_quote_v1_current.py"
      - ".github/workflows/canonical-quote-v1-current.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-quote-v1-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out test authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Clone exact reviewed source heads
        shell: bash
        run: |
          set -euo pipefail
          clone_exact() {
            local repo="$1"
            local sha="$2"
            local dest="$3"
            git init -q "$dest"
            git -C "$dest" remote add origin "https://github.com/$repo.git"
            git -C "$dest" -c protocol.version=2 fetch --depth=1 --no-tags origin "$sha"
            git -C "$dest" checkout --detach FETCH_HEAD
            test "$(git -C "$dest" rev-parse HEAD)" = "$sha"
          }
          clone_exact canonical-cloud/canonical-interfaces \
            4c6ca63ca24fa214a1cb1a917ac27f1d5265916a sources/interfaces
          clone_exact canonical-cloud/canonical-api-server.rs \
            7987c05944df5c03ff2fcbeeedf2c8e79f973d75 sources/api
          clone_exact canonical-cloud/canonical-web-server.rs \
            98b3e2b5d02e5f49687bfd777ec2b79a3f4d7f26 sources/web

      - name: Run fail-closed cross-repository verifier
        run: >-
          python3 scripts/verify_canonical_quote_v1_current.py
          sources/interfaces sources/api sources/web

  api-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact API head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: canonical-cloud/canonical-api-server.rs
          ref: 7987c05944df5c03ff2fcbeeedf2c8e79f973d75
          persist-credentials: false

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Verify exact head and contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7987c05944df5c03ff2fcbeeedf2c8e79f973d75
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          python3 scripts/verify-declarative-db-contract.py

  web-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact web head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: canonical-cloud/canonical-web-server.rs
          ref: 98b3e2b5d02e5f49687bfd777ec2b79a3f4d7f26
          persist-credentials: false

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Verify exact head and browser-facing contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 98b3e2b5d02e5f49687bfd777ec2b79a3f4d7f26
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
