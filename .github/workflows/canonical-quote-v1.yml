name: Canonical quote v1 exact-head conformance

on:
  pull_request:
    paths:
      - ".github/workflows/canonical-quote-v1.yml"
      - "canonical-quote-v1-source.json"
      - "scripts/fetch_exact_public_source.sh"
      - "scripts/verify_canonical_quote_v1.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-quote-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Public wire and authority boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the test harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: ""

      - name: Fetch exact public candidates
        shell: bash
        run: |
          set -euo pipefail
          scripts/fetch_exact_public_source.sh \
            canonical-cloud/canonical-interfaces \
            4c6ca63ca24fa214a1cb1a917ac27f1d5265916a \
            sources/interfaces
          scripts/fetch_exact_public_source.sh \
            canonical-cloud/canonical-api-server.rs \
            7987c05944df5c03ff2fcbeeedf2c8e79f973d75 \
            sources/api
          scripts/fetch_exact_public_source.sh \
            canonical-cloud/canonical-web-server.rs \
            98b3e2b5d02e5f49687bfd777ec2b79a3f4d7f26 \
            sources/web

      - name: Verify repository and quote contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_repository.py
          python3 -m compileall -q scripts
          python3 scripts/verify_canonical_quote_v1.py

  api:
    name: Exact API Rust contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the test harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch exact API candidate
        run: >-
          scripts/fetch_exact_public_source.sh
          canonical-cloud/canonical-api-server.rs
          7987c05944df5c03ff2fcbeeedf2c8e79f973d75
          sources/api

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache API build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: sources/api -> target
          key: canonical-quote-v1-api

      - name: Format
        run: cargo fmt --manifest-path sources/api/Cargo.toml --all -- --check

      - name: Test
        run: cargo test --manifest-path sources/api/Cargo.toml --locked --all-targets --all-features

      - name: Lint
        run: cargo clippy --manifest-path sources/api/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Verify API-owned contracts
        working-directory: sources/api
        run: |
          python3 scripts/verify-ci-contract.py
          python3 scripts/verify-declarative-db-contract.py

  web:
    name: Exact web BFF and client contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the test harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch exact web candidate
        run: >-
          scripts/fetch_exact_public_source.sh
          canonical-cloud/canonical-web-server.rs
          98b3e2b5d02e5f49687bfd777ec2b79a3f4d7f26
          sources/web

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Cache web build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: sources/web -> target
          key: canonical-quote-v1-web

      - name: Verify release boundary
        working-directory: sources/web
        run: node tests/release-boundary.mjs

      - name: Test browser client
        working-directory: sources/web
        run: |
          npm ci --prefix client
          npm test --prefix client
          npm run typecheck --prefix client
          npm run build --prefix client

      - name: Format
        run: cargo fmt --manifest-path sources/web/Cargo.toml --all -- --check

      - name: Test
        run: cargo test --manifest-path sources/web/Cargo.toml --workspace --all-targets --locked

      - name: Lint
        run: cargo clippy --manifest-path sources/web/Cargo.toml --workspace --all-targets --locked -- -D warnings
